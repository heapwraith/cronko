name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci --reporter=github .
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Test Results
          path: "**/test-results.xml"
          reporter: java-junit

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cronko:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot and probe
        run: |
          docker run -d --name cronko -p 3000:3000 \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD=ci-password-123 \
            cronko:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health/ready && break || sleep 1
          done
          echo
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/dashboard | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/auth/login \
            -H 'content-type: application/json' -H 'sec-fetch-site: same-origin' \
            -d '{"email":"admin@example.com","password":"ci-password-123"}')
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/auth/login \
            -H 'content-type: application/json' -H 'sec-fetch-site: cross-site' \
            -d '{"email":"admin@example.com","password":"ci-password-123"}')
          test "$code" = "403"
      - name: Container logs
        if: failure()
        run: docker logs cronko
