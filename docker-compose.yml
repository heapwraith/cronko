services:
  cronko:
    build: .
    image: cronko:local
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Behind a reverse proxy (Caddy, nginx, Traefik) set these:
      # TRUST_PROXY: "true"
      # TRUSTED_ORIGINS: https://cronko.example.com
      SELF_HEARTBEAT_URL: ${SELF_HEARTBEAT_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SELF_HEARTBEAT_INTERVAL_SECONDS: ${SELF_HEARTBEAT_INTERVAL_SECONDS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - cronko_data:/app/data
    restart: unless-stopped

volumes:
  cronko_data:
