services:
  cronko:
    build: .
    image: cronko:local
    ports:
      - "3000:3000"
      # Ping by e-mail: public port 25 to the listener (also set INBOUND_* below).
      # - "25:2525"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Behind a reverse proxy (Caddy, nginx, Traefik) set these:
      # TRUST_PROXY: "true"
      # TRUSTED_ORIGINS: https://cronko.example.com
      SELF_HEARTBEAT_URL: ${SELF_HEARTBEAT_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SELF_HEARTBEAT_INTERVAL_SECONDS: ${SELF_HEARTBEAT_INTERVAL_SECONDS:-}
      # Scheduled SQLite backups: set BACKUP_DIR=/app/backups in .env to turn them on
      # (the second volume below keeps them apart from the live database).
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INBOUND_SMTP_PORT: ${INBOUND_SMTP_PORT:-}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
    volumes:
      - cronko_data:/app/data
      - cronko_backups:/app/backups
    restart: unless-stopped

volumes:
  cronko_data:
  cronko_backups:
