# Optional services for local development.
# Cronko itself uses SQLite (DATABASE_URL=file:./data/cronko.db), so nothing is
# required here. Redis only enables distributed rate limiting (REDIS_URL).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped

volumes:
  redis_dev_data:
