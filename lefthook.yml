pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{ts,tsx,js,mjs,json,css}"
      run: pnpm exec biome check --staged --no-errors-on-unmatched
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

commit-msg:
  commands:
    conventional:
      run: pnpm exec commitlint --edit "{1}"
